name: Increment version after merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-version-main
  cancel-in-progress: false

jobs:
  increment-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Check for Java or Gradle changes
        id: version-trigger
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$MERGE_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '(^|/).*\.java$|(^|/).*\.gradle(\.kts)?$|^gradle/|^gradlew(\.bat)?$'; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Java or Gradle changes detected; incrementing version."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No Java or Gradle changes detected; skipping version increment."
          fi

      - name: Set up JDK 21
        if: steps.version-trigger.outputs.eligible == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set execute permissions for Gradle Wrapper
        if: steps.version-trigger.outputs.eligible == 'true'
        run: chmod +x gradlew

      - name: Increment version
        if: steps.version-trigger.outputs.eligible == 'true'
        run: ./gradlew incrementVersion

      - name: Generate GitHub App Token
        if: steps.version-trigger.outputs.eligible == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Create version update pull request
        if: steps.version-trigger.outputs.eligible == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: increment version"
          title: "chore: increment version"
          body: "Automatically increments the plugin version after Java or Gradle changes are merged into main."
          branch: automated/increment-version
          delete-branch: true
          sign-commits: true
